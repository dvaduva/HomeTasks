<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar Taskuri — HomeTasks</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/calendar.css') }}">
</head>
<body>
<div class="cal-page">
    <header class="cal-header">
        <a href="/" class="cal-back" title="Acasă" aria-label="Acasă">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
        </a>
        <h1>Calendar</h1>
        <div class="cal-clock" id="cal-clock" aria-live="polite">--:--:--</div>
    </header>

    <main class="cal-content">
        <div class="cal-toolbar">
            <div class="cal-nav">
                <button type="button" class="cal-nav-btn" id="cal-prev" title="Anterior" aria-label="Anterior">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
                </button>
                <span class="cal-period" id="cal-period">—</span>
                <button type="button" class="cal-nav-btn" id="cal-next" title="Următor" aria-label="Următor">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
                </button>
                <button type="button" class="cal-today-btn" id="cal-today">Astăzi</button>
            </div>

            <div class="cal-view-switch" role="tablist">
                <button type="button" class="cal-view-btn active" data-view="month" role="tab" aria-selected="true">Lună</button>
                <button type="button" class="cal-view-btn" data-view="year" role="tab" aria-selected="false">An</button>
            </div>
        </div>

        <div class="cal-user-filter" id="cal-user-filter">
            <span class="cal-filter-label">Utilizatori:</span>
            <span class="cal-filter-chips" id="cal-filter-chips">
                <span class="cal-filter-empty">Se încarcă...</span>
            </span>
        </div>

        <div class="cal-view" id="cal-view">
            <p class="cal-empty">Se încarcă...</p>
        </div>
    </main>
</div>

<!-- Modal: detalii zi -->
<div class="cal-modal-overlay" id="cal-day-modal" hidden>
    <div class="cal-modal" role="dialog" aria-modal="true" aria-labelledby="cal-day-modal-title">
        <div class="cal-modal-head">
            <h2 id="cal-day-modal-title">Taskuri</h2>
            <button type="button" class="cal-modal-close" id="cal-day-modal-close" aria-label="Închide">✕</button>
        </div>
        <div class="cal-modal-body" id="cal-day-modal-body"></div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/calendar.js') }}"></script>
</body>
</html>
