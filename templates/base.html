<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeTasks</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="app">

    <!-- HEADER -->
    <header class="header">
        <div class="header-brand">
            <strong>HomeTasks</strong>
        </div>
        <div class="date-time" id="date-time"></div>
        <div class="header-right">
            <div class="weather" id="weather" title="Click pentru prognoză orară"><span class="dim">—°</span></div>
            <button type="button" class="icon-btn" id="settings-btn" title="Setări">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </button>
        </div>
    </header>

    <!-- PROGNOZĂ 5 ZILE -->
    <div class="forecast-strip" id="weather-forecast">
        <span class="forecast-skeleton"></span>
        <span class="forecast-skeleton"></span>
        <span class="forecast-skeleton"></span>
        <span class="forecast-skeleton"></span>
        <span class="forecast-skeleton"></span>
    </div>

    <!-- BARA UTILIZATORI -->
    <div class="user-bar">
        <div class="user-list" id="user-list"></div>
    </div>

    <!-- TASKURI -->
    <div class="tasks-wrap">
        <div class="tasks-toolbar">
            <h2 class="tasks-title" id="tasks-title">Bun venit!</h2>
            <button type="button" class="btn-primary" id="add-task-btn">＋ Task nou</button>
        </div>
        <div class="tasks-grid">
            <div class="task-col">
                <div class="col-label">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                    Toate taskurile
                </div>
                <div class="task-list" id="tasks-list">
                    <p class="empty">Selectați un utilizator.</p>
                </div>
            </div>
            <div class="task-col">
                <div class="col-label today-col">
                    <span class="pulse-dot"></span>
                    Astăzi
                </div>
                <div class="task-list" id="today-tasks-list">
                    <p class="empty">Se încarcă...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="footer-left">
            <button type="button" class="footer-btn btn-voice" id="voice-btn" title="Comandă Vocală">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
                <span id="voice-btn-label">Comandă Vocală</span>
            </button>
            <span class="status-text" id="voice-status">Inactiv</span>
        </div>
        <div class="footer-right">
            <button type="button" class="footer-btn btn-ai" id="ai-btn" title="AI Chat">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                AI Chat
            </button>
        </div>
    </footer>

</div><!-- /.app -->

<!-- POPUP VREME ORARĂ -->
<div class="weather-popup" id="weather-popup" hidden>
    <div class="weather-popup-head">
        <span class="weather-popup-title" id="weather-popup-title">Prognoză orară</span>
        <button type="button" class="weather-popup-close" id="weather-popup-close" title="Închide">✕</button>
    </div>
    <div class="weather-popup-chart-wrap">
        <svg class="weather-chart" id="weather-chart" preserveAspectRatio="none"></svg>
    </div>
    <div class="weather-popup-hours" id="weather-popup-hours"></div>
</div>

<!-- CHAT AI -->
<div class="chat-panel" id="chat-container">
    <div class="chat-head">
        <div class="chat-head-info">
            <span class="chat-avatar">AI</span>
            <div>
                <strong>Asistent</strong>
                <span class="chat-online">● online</span>
            </div>
        </div>
        <button type="button" class="icon-btn" id="close-chat-btn" title="Închide">✕</button>
    </div>
    <div class="chat-messages" id="chat-messages">
        <div class="message ai-message"><p>Salut! Cum vă pot ajuta?</p></div>
    </div>
    <div class="chat-input-wrap">
        <form id="chat-form">
            <input type="text" id="chat-input" placeholder="Scrieți un mesaj..." autocomplete="off">
            <button type="submit" class="btn-send" title="Trimite">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
        </form>
    </div>
</div>

<!-- MODAL SETĂRI -->
<div class="modal-overlay" id="settings-modal">
    <div class="modal">
        <div class="modal-head">
            <h2>Setări</h2>
            <button type="button" class="icon-btn" id="cancel-settings" title="Închide">✕</button>
        </div>
        <div class="settings-tabs">
            <button type="button" class="tab-btn active" data-tab="general">General</button>
            <button type="button" class="tab-btn" data-tab="utilizatori">Utilizatori</button>
            <button type="button" class="tab-btn" data-tab="weather">Vreme</button>
            <button type="button" class="tab-btn" data-tab="ai">AI</button>
            <button type="button" class="tab-btn" data-tab="voice">Vocal</button>
        </div>

        <div class="tab-content" id="utilizatori-tab">
            <div class="settings-users-list" id="settings-users-list">
                <p class="settings-empty">Se încarcă...</p>
            </div>
            <div class="settings-add-user">
                <input type="text" id="settings-new-user-name" placeholder="Nume utilizator nou">
                <input type="color" id="settings-new-user-color" value="#3498db" title="Culoare utilizator">
                <button type="button" class="btn btn-primary btn-sm" id="settings-add-user-btn">＋ Adaugă</button>
            </div>
        </div>

        <div class="tab-content active" id="general-tab">
            <div class="form-group">
                <label for="app-language">Limbă</label>
                <select id="app-language">
                    <option value="ro">Română</option>
                    <option value="en">Engleză</option>
                </select>
            </div>
            <div class="form-group">
                <label for="date-format">Format dată</label>
                <select id="date-format">
                    <option value="short">Scurt (dd/mm/yyyy)</option>
                    <option value="long">Lung</option>
                    <option value="full">Complet</option>
                </select>
            </div>
            <div class="form-group">
                <label for="time-format">Format oră</label>
                <select id="time-format">
                    <option value="24">24h</option>
                    <option value="12">12h AM/PM</option>
                </select>
            </div>
        </div>

        <div class="tab-content" id="weather-tab">
            <div class="form-group">
                <label for="weather-city">Oraș</label>
                <input type="text" id="weather-city" value="București">
            </div>
            <div class="form-group">
                <label for="weather-units">Unități</label>
                <select id="weather-units">
                    <option value="metric">Metric (°C)</option>
                    <option value="imperial">Imperial (°F)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="weather-update">Actualizare (minute)</label>
                <input type="number" id="weather-update" value="30" min="5" max="1440">
            </div>
        </div>

        <div class="tab-content" id="ai-tab">
            <div class="form-group">
                <label for="ollama-url">URL Server Ollama</label>
                <div class="input-with-btn">
                    <input type="text" id="ollama-url" placeholder="http://localhost:11434">
                    <button type="button" class="btn btn-secondary btn-sm" id="load-models-btn" title="Verifică modele disponibile">↻ Modele</button>
                </div>
            </div>
            <div class="form-group">
                <label for="ai-model">Model AI</label>
                <select id="ai-model">
                    <option value="">— selectați modelul —</option>
                </select>
            </div>
            <div class="form-group">
                <label for="ai-temperature">Creativitate — <span id="ai-temp-value">0.7</span></label>
                <input type="range" id="ai-temperature" min="0" max="2" step="0.1" value="0.7">
            </div>
            <div class="form-group">
                <label for="ai-max-tokens">Max tokeni</label>
                <input type="number" id="ai-max-tokens" value="500" min="50" max="2000">
            </div>
        </div>

        <div class="tab-content" id="voice-tab">
            <div class="form-group">
                <label for="voice-language">Limbă recunoaștere</label>
                <select id="voice-language">
                    <option value="ro-RO">Română</option>
                    <option value="en-US">Engleză (SUA)</option>
                    <option value="en-GB">Engleză (UK)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="tts-voice">Voce răspuns AI</label>
                <select id="tts-voice">
                    <option value="">— automat (limbă curentă) —</option>
                </select>
                <small class="form-hint">Vocile disponibile depind de browser și sistemul de operare.</small>
            </div>
            <div class="form-group">
                <label for="voice-sensitivity">Sensibilitate — <span id="voice-sens-value">0.5</span></label>
                <input type="range" id="voice-sensitivity" min="0" max="1" step="0.1" value="0.5">
            </div>
            <div class="form-group form-inline">
                <label for="voice-auto-start">Autopornire</label>
                <input type="checkbox" id="voice-auto-start">
            </div>
        </div>

        <div class="modal-actions">
            <button type="button" class="btn btn-secondary" id="cancel-settings-footer">Anulează</button>
            <button type="button" class="btn btn-primary" id="save-settings">Salvează</button>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const f = document.getElementById('cancel-settings-footer');
        const m = document.getElementById('cancel-settings');
        if (f && m) f.addEventListener('click', () => m.click());
    });
</script>
</body>
</html>
