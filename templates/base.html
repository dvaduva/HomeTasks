<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeTasks</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Add any additional CSS or JS here -->
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <h1 class="header-title">HomeTasks</h1>
                <div class="header-info">
                    <div class="date-time" id="date-time">
                        <!-- Date and time will be updated by JS -->
                    </div>
                    <div class="weather" id="weather">
                        <!-- Weather info will be loaded via AJAX -->
                    </div>
                </div>
                <button class="btn-settings" id="settings-btn">
                    ⚙️
                </button>
            </div>
        </header>

        <div class="main-content">
            <aside class="sidebar" id="sidebar">
                <h2>Utilizatori</h2>
                <div class="user-list" id="user-list">
                    <!-- User list will be populated via JS -->
                </div>
                <button class="btn-add-user" id="add-user-btn">
                    + Utilizator
                </button>
            </aside>

            <section class="main" id="main-section">
                <div class="tasks-header">
                    <h2 id="tasks-title">Bun venit în HomeTasks!</h2>
                    <button class="btn-add-task" id="add-task-btn">+ Task nou</button>
                </div>
                <div class="tasks-container">
                    <div class="tasks-section">
                        <h3>Taskurile utilizatorului</h3>
                        <div id="tasks-list">
                            <p>Selectați un utilizator din lista din stânga pentru a vedea taskurile sale.</p>
                        </div>
                    </div>
                    <div class="tasks-section today-section">
                        <h3>Taskuri de astăzi</h3>
                        <div id="today-tasks-list">
                            <p>Se încarcă...</p>
                        </div>
                    </div>
                </div>
            </section>
        </div>

        <!-- AI Chat Interface -->
        <div class="chat-container" id="chat-container">
            <div class="chat-header">
                <h3>Chat cu AI</h3>
                <button class="btn-close-chat" id="close-chat-btn">✕</button>
            </div>
            <div class="chat-messages" id="chat-messages">
                <!-- AI messages will appear here -->
                <div class="message ai-message">
                    <p>Salut! Sunt HomeTasks AI assistant. Cum vă pot ajuta astăzi?</p>
                </div>
            </div>
            <div class="chat-input-container">
                <form id="chat-form">
                    <input type="text" id="chat-input" placeholder="Scrieți un mesaj..." autocomplete="off" />
                    <button type="submit" class="btn-send">Trimite</button>
                </form>
            </div>
        </div>

        <footer class="footer">
            <div class="footer-content">
                <button class="btn-voice" id="voice-btn">
                    🎤
                </button>
                <div class="voice-status" id="voice-status">
                    Microfons: inactiv
                </div>
                <button class="btn-ai" id="ai-btn">
                    🤖
                </button>
                <div class="ai-status" id="ai-status">
                    AI: gata
                </div>
            </div>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
