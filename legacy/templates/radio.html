<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Online — HomeTasks</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/radio.css') }}">
</head>
<body>
<div class="rd-app">

    <!-- HEADER -->
    <header class="rd-header">
        <a href="/" class="rd-back" title="Acasă">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
        </a>
        <div class="rd-header-title">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 11a9 9 0 0 1 9-9"/><path d="M4 15a5 5 0 0 1 5-5"/><circle cx="5" cy="19" r="2"/><path d="M14 4h6a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6"/><line x1="18" y1="8" x2="18" y2="8"/></svg>
            <span>Radio Online</span>
        </div>
        <div class="rd-header-right">
            <div class="rd-clock" id="rd-clock">--:--</div>
        </div>
    </header>

    <!-- MAIN -->
    <main class="rd-body">

        <!-- Now playing bar -->
        <div class="rd-now-playing" id="rd-now-playing">
            <div class="rd-np-info">
                <div class="rd-np-icon" id="rd-np-icon">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 11a9 9 0 0 1 9-9"/><path d="M4 15a5 5 0 0 1 5-5"/><circle cx="5" cy="19" r="2"/></svg>
                </div>
                <div class="rd-np-text">
                    <div class="rd-np-name" id="rd-np-name">Niciun post selectat</div>
                    <div class="rd-np-status" id="rd-np-status">Selectați un post din listă pentru a porni redarea</div>
                    <div class="rd-np-track" id="rd-np-track"></div>
                </div>
            </div>
            <div class="rd-np-controls">
                <button type="button" class="rd-btn-play" id="rd-btn-play" disabled aria-label="Play/Pauză" title="Play/Pauză">
                    <svg class="rd-icon-play" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                    <svg class="rd-icon-pause" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                </button>
                <div class="rd-volume-wrap">
                    <button type="button" class="rd-btn-mute" id="rd-btn-mute" aria-label="Mute" title="Mute/Unmute">
                        <svg class="rd-icon-vol" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
                        <svg class="rd-icon-muted" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
                    </button>
                    <input type="range" id="rd-volume" min="0" max="100" value="80" aria-label="Volum">
                </div>
            </div>
        </div>

        <!-- Stations list -->
        <section class="rd-stations" id="rd-stations">
            <p class="rd-empty">Se încarcă lista posturilor...</p>
        </section>

    </main>

</div>

<!-- Hidden audio element -->
<audio id="rd-audio" preload="none"></audio>

<script src="{{ url_for('static', filename='js/radio.js') }}"></script>
</body>
</html>
