<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Istoric Taskuri — HomeTasks</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/history.css') }}">
</head>
<body>
<div class="history-page">
    <header class="history-header">
        <a href="/" class="history-back" title="Acasă" aria-label="Acasă">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
        </a>
        <h1>Istoric Taskuri</h1>
        <div class="history-clock" id="history-clock" aria-live="polite">--:--:--</div>
    </header>

    <main class="history-content">
        <div class="history-filters">
            <select id="history-user-filter" title="Filtrează după utilizator">
                <option value="">Toți utilizatorii</option>
            </select>
            <select id="history-status-filter" title="Filtrează după status">
                <option value="">Toate statusurile</option>
                <option value="completed">Finalizate</option>
                <option value="refused">Refuzate</option>
                <option value="pending">În așteptare</option>
            </select>
            <select id="history-period-filter" title="Perioadă">
                <option value="7">Ultimele 7 zile</option>
                <option value="30" selected>Ultima lună</option>
                <option value="90">Ultimele 3 luni</option>
                <option value="365">Ultimul an</option>
                <option value="0">Tot istoricul</option>
            </select>
        </div>

        <div class="history-list" id="history-list">
            <p class="empty">Se încarcă...</p>
        </div>
    </main>
</div>

<script src="{{ url_for('static', filename='js/history.js') }}"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='css/radio-mini.css') }}">
<script src="{{ url_for('static', filename='js/radio-mini.js') }}"></script>
</body>
</html>
